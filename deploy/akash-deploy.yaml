# Akash SDL — 1x NVIDIA A100.
# Build and publish the image from the Triage repository before deploying.
# Replace <your-dockerhub-user> with the Docker Hub namespace that owns the image.
---
version: "2.0"
services:
  triage:
    image: docker.io/<your-dockerhub-user>/triage:a100
    expose:
      - port: 22
        as: 22
        to:
          all: true
    env:
      SSH_PUBKEY: "ssh-ed25519 AAAA...your-key..."
      WANDB_MODE: "disabled"
    params:
      storage:
        data:
          mount: /data
          readOnly: false
    command: ["/start.sh"]

profiles:
  compute:
    triage:
      resources:
        gpu:
          units: 1
          attributes:
            vendor: nvidia
        cpu:
          units: 16
        memory:
          size: 64 Gi
        storage:
          size: 400 Gi
  placement:
    default:
      attributes:
        host: akash
      pricing:
        triage:
          denom: uakt
          amount: 400000

deployment:
  triage:
    triage:
      profile: triage
      count: 1
